<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fondo transparente (o podés cambiar fill a #FFFFFF si querés fondo blanco) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Arco / Sonrisa roja lateral -->
  <path d="M 35,160 A 150,150 0 0,0 270,370" fill="none" stroke="#E11C24" stroke-width="7" stroke-linecap="round" />
  <circle cx="35" cy="160" r="5" fill="#E11C24" />
  <circle cx="270" cy="370" r="5" fill="#E11C24" />

  <!-- Destellos superiores sobre la T -->
  <line x1="85" y1="20" x2="105" y2="60" stroke="#E11C24" stroke-width="7" stroke-linecap="round" />
  <line x1="130" y1="10" x2="135" y2="55" stroke="#E11C24" stroke-width="7" stroke-linecap="round" />
  <line x1="175" y1="20" x2="160" y2="60" stroke="#E11C24" stroke-width="7" stroke-linecap="round" />

  <!-- Texto TiNA -->
  <g fill="#E11C24" font-family="&#39;Arial Black&#39;, &#39;Impact&#39;, sans-serif" font-weight="900">
    <text x="100" y="190" font-size="130" letter-spacing="-2">TiNA</text>
  </g>

  <!-- Texto kids -->
  <g fill="#6B9CA3" font-family="&#39;Comfortaa&#39;, &#39;Fredoka&#39;, &#39;Arial Rounded MT Bold&#39;, sans-serif" font-weight="bold">
    <text x="155" y="270" font-size="95" letter-spacing="-1">kids</text>
  </g>

  <!-- Eslogan VISTIENDO SONRISAS -->
  <g fill="#6B9CA3" font-family="&#39;Montserrat&#39;, &#39;Arial&#39;, sans-serif" font-weight="700">
    <text x="110" y="315" font-size="20" letter-spacing="3.5">VISTIENDO SONRISAS</text>
  </g>
</svg>
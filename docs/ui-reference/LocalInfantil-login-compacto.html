<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalInfantil — Iniciar sesión</title>
<style>
:root{
  --nav:#263D43;
  --canvas:#F2F1EC;
  --surface:#FFFDF9;
  --primary:#286B66;
  --primary-dark:#1F5753;
  --text:#26343B;
  --muted:#607178;
  --border:#CBD4CF;
  --border-soft:#E5E9E6;
  --warning:#9A6A17;
  --warning-soft:#FFF1C9;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Segoe UI",Inter,system-ui,sans-serif;
  color:var(--text);
  background:#DDE4E1;
}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
}
.window{
  width:640px;
  max-width:100%;
  background:var(--surface);
  border:1px solid #AEBAB5;
  border-radius:12px;
  box-shadow:0 24px 70px rgba(25,43,48,.20);
  overflow:hidden;
}
.titlebar{
  height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 14px;
  background:#EDF2F4;
  border-bottom:1px solid #D8E0DD;
  font-size:13px;
}
.app-icon{
  width:18px;
  height:18px;
  border-radius:4px;
  background:var(--primary);
  box-shadow:inset 0 0 0 3px #DDEDEA;
}
.dev-banner{
  height:38px;
  display:flex;
  align-items:center;
  padding:0 14px;
  background:var(--warning-soft);
  border-bottom:1px solid #E7C95E;
  color:#8A5B12;
  font-size:12px;
}
.content{
  padding:34px 46px 38px;
}
.brand{
  font-size:13px;
  font-weight:800;
  letter-spacing:.04em;
  color:var(--primary);
  margin-bottom:8px;
}
h1{
  margin:0 0 6px;
  font-size:28px;
  line-height:1.15;
}
.subtitle{
  margin:0 0 26px;
  color:var(--muted);
  font-size:14px;
}
.form{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.field label{
  font-size:13px;
  font-weight:650;
}
.field input{
  height:44px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  outline:none;
  font-size:14px;
}
.field input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(40,107,102,.10);
}
.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:-2px;
  color:var(--muted);
  font-size:12px;
}
.remember{
  display:flex;
  align-items:center;
  gap:7px;
}
button{
  height:44px;
  border:1px solid var(--primary);
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}
button:hover{background:var(--primary-dark)}
.status{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--border-soft);
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}
.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--warning);
}
@media(max-width:700px){
  .window{width:100%}
  .content{padding:28px 24px 30px}
}
</style>
</head>
<body>
  <main class="window" aria-label="Inicio de sesión LocalInfantil">
    <div class="titlebar">
      <span class="app-icon" aria-hidden="true"></span>
      <strong>LocalInfantil — Desarrollo</strong>
    </div>

    <div class="dev-banner">
      Modo desarrollo — base de prueba activa
    </div>

    <section class="content">
      <div class="brand">LocalInfantil</div>
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Usá tu usuario y contraseña del sistema.</p>

      <form class="form">
        <div class="field">
          <label for="usuario">Usuario</label>
          <input id="usuario" type="text" autocomplete="username" placeholder="Ej. duena">
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Ingresá tu contraseña">
        </div>

        <div class="meta">
          <label class="remember">
            <input type="checkbox">
            <span>Recordar usuario</span>
          </label>
          <span>Enter para ingresar</span>
        </div>

        <button type="submit">Ingresar</button>
      </form>

      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span>Sin internet · sesión local disponible</span>
      </div>
    </section>
  </main>
</body>
</html>
